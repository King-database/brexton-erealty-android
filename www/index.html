
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071629">

  <title>BREXTON eRealty</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071629;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px 20px;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 10px;
    }

    p {
      color: #b8c9dc;
      line-height: 1.6;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      border-radius: 12px;
      background: #08a9e8;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="assets/icon.png"
      alt="BREXTON eRealty"
      class="logo"
    >

    <h1>BREXTON eRealty</h1>

    <p>
      Discover properties, explore listings and connect
      with property agents through our real estate platform.
    </p>

    <a
      class="button"
      href="https://public-figure.hatchable.site/erealty/"
    >
      Open Property Marketplace
    </a>

  </main>

</body>
</html>
