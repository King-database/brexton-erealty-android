
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071629">
  <title>BREXTON eRealty</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071629;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px 20px;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #ffffff;
    }

    p {
      color: #b8c9dc;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #08a9e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .notification {
      background: transparent;
      border: 1px solid #08a9e8;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <img src="assets/icon.png" alt="BREXTON eRealty" class="logo">

    <h1>BREXTON eRealty</h1>
    <p>
      Discover properties, explore listings and connect
      with property agents through our real estate platform.
    </p>

    <button id="openMarketplace">
      Open Property Marketplace
    </button>

    <button id="enableNotifications" class="notification">
      Enable Notifications
    </button>
  </main>

  <script type="module">
    import { PushNotifications } from
      '@capacitor/push-notifications';

    const marketplace =
      'https://public-figure.hatchable.site/erealty/';

    document.getElementById('openMarketplace')
      .addEventListener('click', () => {
        window.location.href = marketplace;
      });

    document.getElementById('enableNotifications')
      .addEventListener('click', async () => {
        try {
          let permission =
            await PushNotifications.requestPermissions();

          if (permission.receive !== 'granted') {
            alert('Notification permission was not granted.');
            return;
          }

          await PushNotifications.register();

          alert('Notification registration requested.');
        } catch (error) {
          alert('Unable to enable notifications. Please try again.');
          console.error(error);
        }
      });

    document.addEventListener('backbutton', () => {
      if (window.location.href !== marketplace) {
        window.location.href = marketplace;
      }
    });
  </script>
</body>
</html>
