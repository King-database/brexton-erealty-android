name: BREXTON eRealty Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify required files
        run: |
          test -f assets/icon.png
          test -f assets/icon-only.png
          test -f assets/splash.png
          test -f google-services.json

      - name: Install dependencies
        run: npm install

      - name: Generate Android project and app assets
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("build.gradle")
          app_gradle = Path("app/build.gradle")

          if not root_gradle.is_file() or not app_gradle.is_file():
              raise SystemExit(
                  "Expected Capacitor Groovy Gradle files were not found."
              )

          root_text = root_gradle.read_text()

          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit(
                      "Could not find the root Gradle dependencies block."
                  )

              root_text = root_text.replace(
                  marker,
                  marker
                  + "\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
              root_gradle.write_text(root_text)

          app_text = app_gradle.read_text()

          if "com.google.gms.google-services" not in app_text:
              app_gradle.write_text(
                  app_text.rstrip()
                  + "\n\napply plugin: 'com.google.gms.google-services'\n"
              )
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brexton-erealty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
